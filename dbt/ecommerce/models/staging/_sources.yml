version: 2

sources:
  - name: raw
    description: >
      Raw Olist Brazilian e-commerce data, loaded by the PySpark ingestion job.
      Public dataset covering orders placed between 2016 and 2018.
    schema: raw
    tables:
      - name: raw_orders
        description: One row per order placed on the marketplace.
        columns:
          - name: order_id
            description: Primary key of the order.
            tests: [unique, not_null]
          - name: customer_id
            description: FK to raw_customers. Unique per order, not per person.
            tests: [not_null]
          - name: order_status
            tests:
              - accepted_values:
                  values:
                    [
                      "delivered",
                      "shipped",
                      "canceled",
                      "unavailable",
                      "invoiced",
                      "processing",
                      "created",
                      "approved",
                    ]

      - name: raw_customers
        description: >
          One row per customer-order pairing. customer_id is unique per order;
          customer_unique_id identifies the actual person.
        columns:
          - name: customer_id
            tests: [unique, not_null]
          - name: customer_unique_id
            description: The real person identifier. Use this for customer analysis.
            tests: [not_null]

      - name: raw_order_items
        description: One row per item line within an order.
        columns:
          - name: order_id
            tests: [not_null]
          - name: product_id
            tests: [not_null]

      - name: raw_order_payments
        description: One row per payment transaction against an order.

      - name: raw_order_reviews
        description: Customer reviews left against orders.

      - name: raw_products
        description: Product catalogue with Portuguese category names.
        columns:
          - name: product_id
            tests: [unique, not_null]

      - name: raw_sellers
        description: Seller catalogue.
        columns:
          - name: seller_id
            tests: [unique, not_null]

      - name: raw_geolocation
        description: Zip code prefix to latitude/longitude mapping.

      - name: raw_category_translation
        description: Portuguese to English product category names.
