name: dbt CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download source data
        run: |
          mkdir -p data/raw
          # In a real pipeline this pulls from S3 or a data lake.
          # Here we generate a small synthetic sample so CI stays fast.
          python ingestion/generate_sample.py

      - name: Run ingestion
        run: python ingestion/load_raw.py

      - name: Install dbt packages
        working-directory: dbt/ecommerce
        run: dbt deps

      - name: Verify dbt connection
        working-directory: dbt/ecommerce
        run: dbt debug

      - name: Build and test all models
        working-directory: dbt/ecommerce
        run: dbt build

      - name: Generate documentation
        working-directory: dbt/ecommerce
        run: dbt docs generate
